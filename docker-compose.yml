services:
  constellation-overwatch:
    build: .
    image: constellation-overwatch:latest
    container_name: constellation-overwatch
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8080:8080"
    volumes:
      - overwatch-data:/data
      # Uncomment if using custom certs
      # - ./certs:/app/certs:ro
    environment:
      # Server
      - HOST=0.0.0.0
      - PORT=8080
      - OVERWATCH_DATA_DIR=/data
      - ALLOWED_ORIGINS=http://localhost:8080

      # NATS
      - NATS_HOST=0.0.0.0       # Bind NATS to all interfaces for edge device access
      - NATS_PORT=4222
      - NATS_MONITOR_HOST=127.0.0.1
      - NATS_MONITOR_PORT=8222

      # NATS TLS (uncomment for production)
      # - NATS_ENABLE_TLS=true
      # - NATS_TLS_CERT=/app/certs/nats.crt
      # - NATS_TLS_KEY=/app/certs/nats.key

      # Production overrides (uncomment and set for production)
      # - OVERWATCH_RPID=yourdomain.com
      # - OVERWATCH_BASE_URL=https://yourdomain.com
      # - OVERWATCH_ADMIN_EMAIL=admin@yourdomain.com
      # - OVERWATCH_KEY_HASH_SECRET=change-me-to-a-random-secret
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  overwatch-data:
