services:
  constellation-overwatch:
    build: .
    image: constellation-overwatch:latest
    container_name: constellation-overwatch
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Uncomment if using custom certs
      # - ./certs:/app/certs:ro
    environment:
      - OVERWATCH_ENV=development
      - HOST=0.0.0.0
      - PORT=8080
      - NATS_HOST=0.0.0.0
      - NATS_PORT=4222
      - OVERWATCH_DATA_DIR=/app/data
      - OVERWATCH_BASE_URL=http://localhost:8080
      - OVERWATCH_RPID=localhost
      - OVERWATCH_ALLOWED_ORIGINS=http://localhost:8080
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
