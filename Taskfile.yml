version: "3"

vars:
  BINARY_NAME: overwatch
  DOCKER_IMAGE: constellation-overwatch:latest
  SERVER_CMD: go run ./cmd/microlith/main.go start
  DEV_PROXY: http://localhost:8080
  TEMPL: go tool templ

tasks:
  build:
    desc: Build the binary
    cmds:
      - echo "Building {{.BINARY_NAME}}..."
      - go build -o bin/{{.BINARY_NAME}} ./cmd/microlith

  run:
    desc: Run the binary
    deps: [build]
    cmds:
      - echo "Running {{.BINARY_NAME}}..."
      - ./bin/{{.BINARY_NAME}} start

  tui:
    desc: Run with TUI dashboard
    cmds:
      - "{{.SERVER_CMD}} --tui"

  build-tui:
    desc: Build binary and run TUI
    deps: [build]
    cmds:
      - ./bin/{{.BINARY_NAME}} start --tui

  docker-build:
    desc: Build Docker image
    cmds:
      - echo "Building Docker image..."
      - docker build -t {{.DOCKER_IMAGE}} .

  docker-run:
    desc: Start services with Docker Compose
    cmds:
      - echo "Starting services with Docker Compose..."
      - docker-compose up -d

  docker-stop:
    desc: Stop Docker Compose services
    cmds:
      - echo "Stopping services..."
      - docker-compose down

  clean:
    desc: Clean up build artifacts and data
    cmds:
      - echo "Cleaning up..."
      - rm -rf bin/
      - rm -rf data/
      - rm -rf logs/

  generate-certs:
    desc: Generate self-signed certificates for development
    cmds:
      - echo "Generating self-signed certificates for development..."
      - mkdir -p certs
      - openssl req -x509 -newkey rsa:4096 -keyout certs/server.key -out certs/server.crt -days 365 -nodes -subj "/CN=localhost"
      - chmod 644 certs/server.crt
      - chmod 600 certs/server.key
      - echo "Certificates generated in ./certs/"

  templ-generate:
    desc: Generate templ files
    cmds:
      - echo "Generating templ files..."
      - "{{.TEMPL}} generate"

  templ-clean:
    desc: Clean templ cache and regenerate
    cmds:
      - echo "Cleaning templ cache..."
      - rm -rf ${TMPDIR:-/tmp}/templ_* 2>/dev/null || true
      - rm -rf /tmp/templ_* 2>/dev/null || true
      - echo "Regenerating templ files..."
      - "{{.TEMPL}} generate"

  templ-watch:
    desc: Start templ file watcher
    cmds:
      - echo "Starting templ file watcher..."
      - '{{.TEMPL}} generate --watch --proxy="{{.DEV_PROXY}}" --open-browser=false'

  dev:
    desc: Start development mode (build and run)
    cmds:
      - '{{.TEMPL}} generate --watch --proxy="{{.DEV_PROXY}}" --open-browser=false --cmd="{{.SERVER_CMD}}"'

  default:
    desc: Show available tasks
    cmds:
      - task --list
